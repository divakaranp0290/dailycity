<section class="admin-container">

  <h1>Admin – Update City Daily Data</h1>

  <form #adminForm="ngForm" (ngSubmit)="submit(adminForm)">

    <!-- CITY -->
    <div class="form-group">
      <label>City *</label>
      <select name="city" [(ngModel)]="city" (change)="onCityChanged($event)" required>

        <option *ngFor="let c of cities" [value]="c">
          {{ c | titlecase }}
        </option>

      </select>
    </div>

    <button type="button" (click)="autoFillTodayData()">
      Load Today’s Data
    </button>


    <!-- DATE -->
    <div class="form-group">
      <label>Date *</label>
      <input type="date" name="date" [(ngModel)]="date" required #dateCtrl="ngModel" />

      <small class="error" *ngIf="dateCtrl.invalid && dateCtrl.touched">
        Date is required
      </small>
    </div>

    <!-- TODAY SPECIAL -->
    <div class="form-group">
      <label>Today Special</label>
      <textarea name="today_special" [(ngModel)]="today_special" maxlength="500" rows="3"></textarea>
      <small>Max 500 characters</small>
    </div>

    <!-- PETROL -->
    <div class="form-group">
      <label>Petrol Price (₹)</label>
      <input type="number" name="petrol" [(ngModel)]="petrol" min="1" step="0.01" #petrolCtrl="ngModel" />

      <small class="error" *ngIf="petrolCtrl.invalid && petrolCtrl.touched">
        Enter a valid petrol price
      </small>
    </div>

    <!-- GOLD -->
    <div class="form-group">
      <label>Gold Rate 22K (₹ / gram)</label>
      <input type="number" name="gold_22k" [(ngModel)]="gold_22k" min="1" step="0.01" #goldCtrl="ngModel" />

      <small class="error" *ngIf="goldCtrl.invalid && goldCtrl.touched">
        Enter a valid gold rate
      </small>
    </div>

    <!-- SUNRISE -->
    <div class="form-group">
      <label>Sunrise</label>
      <input type="text" name="sunrise" [(ngModel)]="sunrise" maxlength="10" placeholder="06:32 AM" />
    </div>

    <!-- SUNSET -->
    <div class="form-group">
      <label>Sunset</label>
      <input type="text" name="sunset" [(ngModel)]="sunset" maxlength="10" placeholder="06:01 PM" />
    </div>

    <!-- TITHI -->
    <div class="form-group">
      <label>Tithi</label>
      <input type="text" name="tithi" [(ngModel)]="tithi" maxlength="50" />
    </div>

    <!-- RAHU KALAM -->
    <div class="form-group">
      <label>Rahu Kalam</label>
      <input type="text" name="rahu_kalam" [(ngModel)]="rahu_kalam" maxlength="20" placeholder="01:30 PM – 03:00 PM" />
    </div>

    <!-- YAMAGANDAM -->
    <div class="form-group">
      <label>Yamagandam</label>
      <input type="text" name="yamagandam" [(ngModel)]="yamagandam" maxlength="20" placeholder="09:00 AM – 10:30 AM" />
    </div>

    <button type="button" (click)="copyYesterday()" class="secondary-btn">
      Copy Yesterday’s Data
    </button>

    <!-- SUBMIT -->
    <button type="submit" [disabled]="adminForm.invalid || loading">
      {{ loading ? 'Saving…' : 'Save Data' }}
    </button>


  </form>

  <p *ngIf="success" class="success-msg">
    City data updated successfully.
  </p>

  <p *ngIf="error" class="error-msg">
    Failed to update city data.
  </p>

</section>
