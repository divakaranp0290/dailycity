<section class="login-container">

  <h1>Admin Login</h1>

  <form (ngSubmit)="login()">

    <div class="form-group">
      <label>Admin Password</label>
      <input
        type="password"
        [(ngModel)]="password"
        name="password"
        required
        placeholder="Enter admin password" />
    </div>

    <button type="submit">
      Login
    </button>

    <p *ngIf="error" class="error-msg">
      Invalid password
    </p>

  </form>

</section>
